<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-group">
    <label for="email">Email address</label>
    <input type="email" formControlName="email" class="form-control" id="email" placeholder="Enter email">
    <small class="form-text text-muted" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
      Enter a valid email.
    </small>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" formControlName="password" class="form-control" id="password" placeholder="Password">
    <small class="form-text text-muted" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
      Password must be at least 6 characters.
    </small>
  </div>

  <div class="form-group form-check">
    <input type="checkbox" formControlName="check" class="form-check-input" id="check">
    <label class="form-check-label" for="check">Check me out</label>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Submit</button>
</form>
