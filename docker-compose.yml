# Runs the production image locally, reading configuration from .env.
#
#   docker compose up --build
#
# The database stays on MongoDB Atlas — there is no local Mongo service here on
# purpose, so what you test locally is what runs in production.

services:
  web:
    build: .
    image: mr-enginero:latest
    restart: unless-stopped
    # Reaps stray child processes; the app handles SIGTERM itself.
    init: true
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 3000
      # No reverse proxy in front when run this way.
      TRUST_PROXY: 0
      PUBLIC_ORIGIN: http://localhost:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{process.exitCode=r.ok?0:1}).catch(()=>{process.exitCode=1})"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
